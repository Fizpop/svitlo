name: svitlo
on:
  workflow_dispatch:  # запускає кнопка "💡 Світло" в Telegram (через worker/) або "Run workflow"
    inputs:
      chat:
        description: "Кому слати (CHAT_ID); порожньо = власнику"
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: mcr.microsoft.com/playwright/python:v1.63.0-noble  # Chromium і xvfb уже всередині, версія = requirements.txt
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ inputs.chat || secrets.CHAT_ID }}
      CITY: ${{ secrets.CITY }}
      STREET: ${{ secrets.STREET }}
      HOUSE: ${{ secrets.HOUSE }}
      LINE: ${{ secrets.LINE }}
      HEADLESS: "0"  # у headless сайт ДТЕК не віддає підказки; xvfb дає віртуальний екран
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -r requirements.txt
      - run: xvfb-run -a python svitlo.py --once --manual
